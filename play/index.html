<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#183f36" />
    <title>Wildlight · The Asterra League</title>
    <style>
      button {
        position: relative;
      }
      button > canvas.command-face {
        position: absolute !important;
        inset: 0 !important;
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        display: block !important;
        pointer-events: none !important;
        border: 0 !important;
        margin: 0 !important;
        transform: none !important;
        object-fit: fill !important;
        image-rendering: auto !important;
        border-radius: inherit;
      }
      .member > canvas.command-face {
        width: 100% !important;
      }
      * {
        box-sizing: border-box;
      }
      :root {
        --ink: #223f35;
        --pine: #20483d;
        --cream: #f6f3e8;
        --line: #cecfc0;
        --gold: #e5af59;
      }
      body {
        margin: 0;
        color: var(--ink);
        background-color: var(--cream);
        background-image: radial-gradient(#bcc1ac70 0.7px, transparent 0.7px);
        background-size: 5px 5px;
        font:
          15px "Trebuchet MS",
          Arial,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible,
      canvas:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #dc9142;
        outline-offset: 3px;
      }
      .ico {
        width: 19px;
        height: 19px;
        vertical-align: middle;
        image-rendering: pixelated;
      }
      .place,
      .interact {
        position: absolute;
        left: 14px;
        border: 1px solid #233d30;
        background: #203e32ed;
        color: #fff5d7;
        border-radius: 4px;
        pointer-events: none;
      }
      .place {
        top: 13px;
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 8px 12px;
        font: 700 15px Georgia;
      }
      .place small {
        font: 700 8px monospace;
        display: block;
        letter-spacing: 1.5px;
        color: #d0dabc;
        margin-bottom: 3px;
      }
      .interact {
        bottom: 12px;
        font-size: 12px;
        padding: 6px 10px;
        pointer-events: auto;
      }
      .interact kbd {
        background: #efe9cb;
        color: #254332;
        margin-right: 6px;
      }
      kbd {
        display: inline-block;
        min-width: 17px;
        background: #faf8ec;
        border: 1px solid #aeb6a5;
        border-bottom-width: 2px;
        border-radius: 3px;
        text-align: center;
        padding: 2px 4px;
        font: 700 10px monospace;
      }
      .touch {
        display: none;
        justify-content: space-between;
        padding: 6px;
        background: #e9edde;
      }
      .touch button {
        min-width: 38px;
        height: 38px;
        background: #fbfaed;
        border: 1px solid #b2bba7;
        border-radius: 4px;
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: #132e26a8;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 16px;
      }
      .overlay[hidden] {
        display: none;
      }
      #window {
        background: #f7f5e9;
        border: 3px solid #244a3c;
        border-radius: 8px;
        box-shadow: 0 8px 0 #172c254d;
        width: min(730px, 100%);
        max-height: 90dvh;
        overflow: auto;
      }
      .whead {
        position: sticky;
        top: 0;
        z-index: 2;
        background: #244a3c;
        color: #faf7e9;
        padding: 14px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .whead h2 {
        font: 700 22px Georgia;
      }
      .whead button {
        background: transparent;
        color: inherit;
        border: 1px solid #839789;
        border-radius: 3px;
      }
      .content {
        padding: 18px;
      }
      .content p {
        line-height: 1.5;
        margin-bottom: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 9px;
      }
      .choice,
      .action,
      .entry {
        border: 1px solid #b9c2b0;
        background: #fffdf2;
        border-radius: 4px;
        padding: 10px;
        text-align: left;
      }
      .choice canvas {
        display: block;
        width: 100%;
        height: 105px;
        object-fit: contain;
        image-rendering: pixelated;
      }
      .family-strip {
        display: flex;
        align-items: stretch;
        gap: 4px;
      }
      .family-strip .choice {
        flex: 1 1 0;
        min-width: 0;
        padding: 4px;
        border-radius: 0;
        text-align: center;
        font: bold clamp(10px, 2.4vw, 14px) monospace;
      }
      .family-strip .choice[aria-current="true"] {
        background: #dbe4c9;
        border-color: #42664c;
      }
      .family-strip canvas[data-id] {
        height: clamp(65px, 18vw, 120px);
      }
      .choice b,
      .entry b {
        display: block;
        margin: 4px 0;
      }
      .choice small,
      .entry small {
        display: block;
        line-height: 1.45;
        color: #596c5a;
      }
      .actions,
      .filters {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 9px 0;
      }
      .action {
        font-size: 13px;
        font-weight: bold;
      }
      .primary {
        background: #2d5541;
        color: #fff9df;
      }
      .entry {
        display: flex;
        gap: 9px;
        align-items: center;
        width: 100%;
        margin: 5px 0;
      }
      .entry canvas {
        width: 48px;
        height: 45px;
        image-rendering: pixelated;
      }
      .filters input,
      .filters select,
      input,
      select {
        border: 1px solid #aab8a5;
        border-radius: 3px;
        padding: 7px;
        max-width: 100%;
        background: #fffdf4;
        color: #273f32;
      }
      .pixel {
        width: 100%;
        image-rendering: pixelated;
        background: #dfe7cf;
        border-radius: 3px;
      }
      .message {
        background: #eaedda;
        border-left: 3px solid #809768;
        padding: 10px;
        margin: 9px 0;
        font-size: 14px;
      }
      .maplist {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .puz {
        display: flex;
        gap: 9px;
        margin: 18px 0;
      }
      .puz button {
        flex: 1;
        background: #e3ebce;
        border: 2px solid #557760;
        padding: 12px 2px;
        font: 700 20px monospace;
        color: var(--ink);
      }
      .puz .lit {
        background: #a9cb87;
      }
      .bars {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        gap: 8px;
      }
      .battlebtn {
        min-height: 55px;
      }
      .portrait {
        float: left;
        width: 65px;
        height: 65px;
        image-rendering: pixelated;
        margin-right: 12px;
      }
      .toast {
        pointer-events: none;
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 5px;
        background: #203e32;
        color: white;
        padding: 10px 18px;
        z-index: 9;
        font: 13px monospace;
        text-align: center;
      }
      .toast:empty {
        display: none;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      :root {
        color-scheme: dark;
        --ink: #f4ebce;
        --pine: #1b3f35;
        --gold: #f2cc83;
        --line: #6e8972;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #132c2b;
        color: #f2ecd5;
        font-family: "Trebuchet MS", Arial, sans-serif;
      }
      button {
        font-family: inherit;
      }
      #stage {
        padding: 0;
        margin: 0;
        max-width: none;
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: #142d2c;
        isolation: isolate;
      }
      #fieldframe {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(100vw, 171.42857dvh);
        height: min(100dvh, 58.33333vw);
        box-shadow: 0 0 80px #071c1b;
      }
      #world {
        width: 100%;
        height: 100%;
        outline: 0;
        display: block;
        image-rendering: pixelated;
        touch-action: none;
      }
      #titleArt {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
        touch-action: manipulation;
        outline: none;
      }
      #titleArt[hidden],
      .titleMode #fieldframe,
      .titleMode #gameHud,
      .titleMode .touch {
        display: none !important;
      }
      #gameHud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #gameHud button {
        pointer-events: auto;
      }
      .place {
        left: clamp(12px, 2.5vw, 42px);
        top: clamp(12px, 2.6vh, 34px);
        border: 2px solid #adc29e;
        background: #183b31ed;
        border-radius: 0;
        box-shadow: 0 2px 0 #233e35;
        padding: 9px 15px;
        color: #fff4cf;
      }
      .place small {
        letter-spacing: 1.6px;
      }
      .interact,
      .menukey {
        border: 2px solid #acc19e;
        background: #183b31ef;
        color: #fff0c8;
        border-radius: 0;
        font:
          700 13px "Courier New",
          monospace;
        box-shadow: 0 2px 0 #233e35;
      }
      .interact {
        bottom: clamp(13px, 3vh, 40px);
        left: clamp(12px, 2.5vw, 42px);
        padding: 9px 12px;
      }
      .menukey {
        position: absolute;
        right: clamp(12px, 2.5vw, 42px);
        top: clamp(12px, 2.6vh, 34px);
        padding: 9px 13px;
      }
      .menukey span {
        color: #e2c687;
        margin-right: 5px;
      }
      .touch {
        position: absolute;
        bottom: max(14px, env(safe-area-inset-bottom));
        left: 3vw;
        right: 3vw;
        background: none;
        padding: 0;
        pointer-events: none;
      }
      .touch button {
        pointer-events: auto;
        background: #19352ee0;
        color: #ede6c7;
        border: 2px solid #a6b99c;
        border-radius: 4px;
        height: 43px;
        min-width: 43px;
        margin: 2px;
      }
      .overlay {
        background: #152d27a6;
        backdrop-filter: none;
        padding: clamp(8px, 2vw, 28px);
      }
      #window {
        border: 2px solid #ddd8ad;
        outline: 3px solid #203e36;
        background: #eff0da;
        color: #2a4437;
        border-radius: 0;
        box-shadow: 5px 6px 0 #102b2aa1;
        width: min(760px, 100%);
        max-height: 92dvh;
        scrollbar-color: #8b9a7a #e6e8ce;
        scrollbar-width: thin;
      }
      .whead {
        padding: 13px 17px;
        background: #214c3e;
        border-bottom: 3px solid #bdc598;
      }
      .whead h2 {
        margin: 0;
        font:
          700 19px/1.2 "Courier New",
          monospace;
        letter-spacing: -0.7px;
        color: #fff3d5;
      }
      .whead button {
        position: relative;
        background: #385a48;
        color: #f4e8c4;
        border: 1px solid #8da385;
        border-radius: 0;
        padding: 4px 8px;
        font: bold 12px monospace;
      }
      .content {
        padding: 16px;
        background: #f2f1df;
      }
      .content p {
        font-size: 15px;
        line-height: 1.55;
      }
      .action,
      .choice,
      .entry,
      .puz button {
        border: 1px solid #99ac90;
        border-bottom: 3px solid #a6b597;
        border-radius: 0;
        background: #fbf8e6;
        color: #294733;
      }
      .action {
        padding: 9px 13px;
        min-height: 37px;
      }
      .primary {
        background: #315740;
        color: #fff5cf;
        border-color: #173e31;
      }
      .action:focus-visible,
      .entry:focus-visible,
      .choice:focus-visible {
        outline: 2px solid #ac7c34;
        outline-offset: 1px;
      }
      .entry {
        margin: 7px 0;
      }
      .choice b {
        font: 700 18px Georgia;
      }
      .choice .tag {
        margin-top: 4px;
      }
      .message {
        background: #e1e6cf;
        border-left: 3px solid #879e72;
      }
      .pixel {
        border-radius: 0;
      }
      .toast {
        border: 2px solid #c1ceac;
        border-radius: 0;
        bottom: 17px;
        background: #244435;
        color: #fff0cc;
      }
      .tag,
      .micro {
        letter-spacing: 1px;
      }
      .shelf {
        display: none !important;
      }
      .overlay[data-scene="dialogue"] {
        align-items: end;
        background: linear-gradient(transparent 45%, #112b215c);
        padding-bottom: 5vh;
      }
      .overlay[data-scene="dialogue"] #window {
        width: min(820px, 100%);
      }
      .overlay[data-scene="dialogue"] .content {
        min-height: 110px;
      }
      .overlay[data-scene="dialogue"] .portrait {
        width: 110px;
        height: 115px;
        margin: 0 15px 5px 0;
      }
      .overlay[data-scene="dialogue"] .action {
        float: right;
      }
      .overlay[data-scene="dialogue"] .content:after {
        content: "";
        display: block;
        clear: both;
      }
      .overlay[data-scene="battle"] {
        background: #162d27e8;
      }
      .overlay[data-scene="battle"] #window {
        width: min(100%, 1040px, 146dvh);
      }
      .overlay[data-scene="battle"] .whead {
        display: none;
      }
      .overlay[data-scene="battle"] .content {
        padding: 10px 12px;
      }
      .overlay[data-scene="battle"] .bars {
        font: 700 11px monospace;
        padding: 2px 2px 6px;
      }
      .overlay[data-scene="battle"] .message {
        margin: 6px 0;
        border: 1px solid #a9b79a;
        background: #fff8de;
        font: 700 14px/1.4 monospace;
      }
      .overlay[data-scene="battle"] .actions {
        margin: 7px 0 0;
      }
      .overlay[data-scene="battle"] .battlebtn {
        min-height: 47px;
      }
      .overlay[data-scene="pause"] #window {
        width: min(510px, 100%);
      }
      .pausehead {
        display: flex;
        align-items: center;
        gap: 11px;
        border-bottom: 1px dashed #b1bba0;
        margin-bottom: 12px;
        padding-bottom: 12px;
      }
      .pausehead canvas {
        width: 65px;
        height: 54px;
        image-rendering: pixelated;
      }
      .pausehead b,
      .pausehead small {
        display: block;
      }
      .pausehead small {
        color: #586f55;
        margin-top: 4px;
      }
      .pausegrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px;
      }
      .pausegrid button {
        text-align: left;
      }
      .overlay[data-scene="starters"] .choice {
        background: linear-gradient(#dce6c8 0 115px, #fbf8e6 115px);
        padding: 12px;
      }
      .overlay[data-scene="starters"] .choice canvas[data-id] {
        height: 104px;
      }
      .overlay[data-scene="starters"] .choice .tag {
        display: inline-block;
      }
      .smallnote {
        font: 12px/1.5 monospace;
        color: #5e735b;
      }
      .touch #pad {
        display: grid;
        grid-template-columns: repeat(3, 43px);
        grid-template-rows: 40px 40px;
        gap: 2px;
      }
      .touch #pad button:nth-child(1) {
        grid-column: 1;
        grid-row: 2;
      }
      .touch #pad button:nth-child(2) {
        grid-column: 2;
        grid-row: 1;
      }
      .touch #pad button:nth-child(3) {
        grid-column: 2;
        grid-row: 2;
      }
      .touch #pad button:nth-child(4) {
        grid-column: 3;
        grid-row: 2;
      }
      .touch > button {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        align-self: end;
      }
      @media (max-width: 650px) {
        .place {
          padding: 6px 9px;
        }
        .place small {
          font-size: 7px;
        }
        .interact {
          font-size: 11px;
        }
        .content {
          padding: 11px;
        }
        .overlay .actions {
          gap: 5px;
        }
        .overlay .action {
          font-size: 12px;
        }
        .overlay[data-scene="battle"] .battlebtn {
          min-height: 44px;
        }
        .overlay[data-scene="battle"] .grid {
          grid-template-columns: 1fr 1fr;
        }
        .whead h2 {
          font-size: 16px;
        }
        .overlay[data-scene="starters"] .choice canvas[data-id] {
          height: 70px;
        }
        .overlay[data-scene="starters"] .choice {
          background: #fbf8e6;
          padding: 7px;
        }
        .choice b {
          font-size: 14px;
        }
        .choice small {
          font-size: 11px;
        }
      }
      @media (pointer: coarse), (max-width: 730px) {
        .touch {
          display: flex;
        }
        .interact {
          bottom: 110px;
        }
        .menukey .esckey {
          display: none;
        }
      }
      @media (max-aspect-ratio: 1/1) {
        #fieldframe {
          width: 100vw;
          height: 75dvh;
          top: 40%;
          overflow: hidden;
        }
        #world {
          width: auto;
          min-width: 100%;
          height: 100%;
          position: absolute;
          left: 50%;
          transform: translateX(-50%);
        }
        #stage {
          background: linear-gradient(#13382c, #183a32 70%, #0c2825);
        }
        #gameHud .interact {
          bottom: 23dvh;
        }
        .touch {
          bottom: 5dvh;
        }
        .touch #pad {
          transform: scale(1.2);
          transform-origin: bottom left;
        }
        .touch > button {
          width: 65px;
          height: 65px;
        }
        .overlay[data-scene="battle"] #window {
          width: 100%;
        }
      }
      @media (max-height: 490px) and (min-aspect-ratio: 1/1) {
        .overlay {
          padding: 5px;
        }
        .overlay[data-scene="battle"] #window {
          width: min(98vw, 185dvh);
          max-height: 98dvh;
        }
        .overlay[data-scene="battle"] #arena {
          height: 43dvh;
          object-fit: cover;
        }
        .overlay .action {
          min-height: 30px;
          padding: 5px 8px;
        }
        .overlay .content {
          padding: 6px;
        }
        .overlay[data-scene="battle"] .battlebtn {
          min-height: 33px;
        }
        .overlay[data-scene="battle"] .message {
          padding: 4px;
        }
        .whead {
          padding: 6px 12px;
        }
      }
      .filters input,
      .filters select,
      .content input,
      .content select {
        color-scheme: light;
        background: #faf7df;
        border: 1px solid #8a9e7e;
        border-radius: 0;
        font: 13px monospace;
      }
      .content input[type="range"] {
        accent-color: #517345;
      }
      .content details {
        margin: 8px 0;
      }
      .overlay[data-scene="starters"] .choice {
        background: #f9f5e3;
      }
      .overlay[data-scene="starters"] .choice canvas[data-id] {
        background: #e0e7ce;
      }
      .tag {
        font: 700 10px monospace;
        text-transform: uppercase;
        background: #d9e4c5;
        color: #42633e;
        padding: 2px 5px;
      }
      .whead .action {
        color: #fff2d1;
      }
      button:focus-visible {
        outline: 2px solid #bd9157;
        outline-offset: 2px;
      }
      .showcase canvas[data-id] {
        width: 145px;
        height: 125px;
        object-fit: contain;
        background: #e5e7d2;
      }
      .showcase {
        padding: 7px 12px;
      }
      .showcase b {
        font: 700 20px Georgia;
      }
      .overlay[data-scene="starters"] #window {
        width: min(850px, 100%);
      }
      .overlay[data-scene="starters"] .choice canvas[data-id] {
        height: clamp(85px, 15vw, 150px);
        object-fit: cover;
        width: 100%;
      }
      @media (max-width: 540px) {
        .overlay[data-scene="dialogue"] .portrait {
          width: 75px;
          height: 78px;
        }
        .overlay[data-scene="starters"] .grid {
          grid-template-columns: 1fr;
        }
        .overlay[data-scene="starters"] .choice {
          display: grid;
          grid-template-columns: 100px 1fr;
          column-gap: 8px;
        }
        .overlay[data-scene="starters"] .choice canvas[data-id] {
          grid-row: 1/4;
          height: 80px;
        }
        .overlay[data-scene="starters"] .tag {
          justify-self: start;
        }
        .overlay[data-scene="starters"] .choice b {
          margin: 0;
        }
        .overlay[data-scene="starters"] .content p {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <main id="stage" class="titleMode">
      <div id="fieldframe">
        <canvas
          id="world"
          width="384"
          height="224"
          tabindex="0"
          aria-label="Asterra expedition world"
        ></canvas>
      </div>
      <div id="gameHud">
        <div class="place">
          <canvas class="ico" data-art="pin"></canvas>
          <div><small id="zoneLabel"></small><span id="loc"></span></div>
        </div>
        <button class="menukey" onclick="pauseUI()" aria-label="Open game menu">
          <span>☰</span> Menu</button
        ><button class="interact" onclick="interact()">
          <kbd>E</kbd><span id="hint"></span>
        </button>

        return [
          name,
          {
            bud: bud.split(" "),
            notes: paired ? [first, final] : [first, middle, final],
            developingShape,
            matureShape,
            veins,

        ];

            el =

          let evo =

      function drawEvolution(t) {

        rect(c, 0, 0, 280, 108, "#243e39");
        if (d.revealed) {
          const age = Math.max(0, t - d.t),
            morph = Math.min(1, age / 850);
          const first = sprite(d.from),
            last = sprite(d.to);
          for (let x = 0; x < 88; x += 2) {
            const seam = Math.max(
              0,
              Math.min(
                78,
                Math.round(83 - 92 * morph + 5 * Math.sin(x * 0.11)),
              ),
            );
            if (seam) c.drawImage(first, x, 0, 2, seam, 96 + x, 5, 2, seam);
            if (seam < 78)
              c.drawImage(
                last,
                x,
                seam,
                2,
                78 - seam,
                96 + x,
                5 + seam,
                2,
                78 - seam,
              );
            if (seam > 3 && seam < 76 && x % 8 === 0)
              rect(c, 96 + x, 4 + seam, 1, 1, "#dac794");
          }
          const tint = coats[species[d.to].f][2];
          for (let j = 0; j < 14; j++) {
            const angle = j * 2.4,
              rad = 18 + morph * (20 + (j % 4) * 5);
            rect(
              c,
              Math.round(140 + Math.cos(angle) * rad),
              Math.round(50 + Math.sin(angle) * rad * 0.7 - 9 * morph),
              1,
              2,
              tint,
            );

          c.font = "bold 10px monospace";

          c.fillText(species[d.to].name, 140, 95);

        glow.addColorStop(0, "#566d4e");
        glow.addColorStop(1, "#243e39");
        c.fillStyle = glow;
        c.fillRect(144, 0, 136, 104);
        const phase = G.options.reduced ? 0 : (t - d.t) / 1400;
        for (let j = 0; j < 12; j++) {
          let x = 202 + Math.cos(j * 7.3 + phase * 0.3) * (40 + (j % 3) * 5),
            y = 45 + Math.sin(j * 7.3 + phase * 0.3) * (30 + (j % 4) * 3);
          rect(c, x | 0, y | 0, 1 + (j % 4 === 0), 1, "#a5b587");
        }
        for (const [id, x] of [
          [d.from, 71],
          [d.to, 208],

          c.font = "bold 10px monospace";
          c.textAlign = "center";
          c.fillText(species[id].name, x, 95);

        c.fillStyle = "#ddc68b";
        c.fill(new Path2D("M132 44 H142 V40 L150 47 L142 54 V50 H132Z"));

      function walkTo(x, y, actor = null) {
        let sx = G.x,
          sy = G.y,
          cell = 4,
          queue = [[sx, sy, -1]],
          seen = new Set([sx + "," + sy]),
          best = 0,
          bestD = 1e9,
          goal = actor ? 9 : 3;
        for (let i = 0; i < queue.length && i < 6500; i++) {
          let [xx, yy] = queue[i],
            d = Math.hypot(xx - x, yy - y);

            let nx = xx + dx * cell,
              ny = yy + dy * cell,
              key = nx + "," + ny;
            if (seen.has(key) || !canWalk(nx, ny)) continue;
            seen.add(key);
            queue.push([nx, ny, i]);
          }
        }
        plannedWalk = [];
        while (best > 0) {
          let [xx, yy, prev] = queue[best];
          plannedWalk.push([xx, yy]);
          best = prev;
        }
        plannedWalk.reverse();
        arrival = bestD <= goal ? actor : null;
        if (!plannedWalk.length && arrival) {
          let a = arrival;
          arrival = null;
          a.fn();
        }
      }

        if (!plannedWalk.length) return false;

          wy = Math.round(
            Math.max(bannerY + 19, H * (portrait ? 0.62 : 0.607)),
          ),
          ww = portrait ? 145 : 148,
          rh = 15,
          wh = opts.length * rh + 10,
          xx = cx - ww / 2;
        rect(c, xx + 2, wy + 3, ww, wh, "#304e428c");
        rect(c, xx, wy, ww, wh, "#1e453bf5");
        rect(c, xx + 1, wy + 1, ww - 2, 1, "#afbc94");
        rect(c, xx + 1, wy + wh - 2, ww - 2, 1, "#77947b");
        for (let a of [xx, xx + ww - 4])
          for (let y of [wy, wy + wh - 4]) rect(c, a, y, 4, 4, "#d2be87");
        titleButtons = [];
        for (let j = 0; j < opts.length; j++) {
          let y = wy + 5 + j * rh,
            sel = j === titleIndex;
          if (sel) {
            rect(c, xx + 5, y, ww - 10, rh - 1, "#47664c");
            poly(
              c,
              [
                [xx + 11, y + 4],
                [xx + 16, y + 7],
                [xx + 11, y + 10],
              ],
              "#f3d78b",
            );
          }
          c.fillStyle = sel ? "#fff0c3" : "#c2d1b8";
          c.font = "bold 8px monospace";
          c.textAlign = "left";
          pixelText(c, opts[j], xx + 22, y + 4, sel ? "#fff1c7" : "#b8cdb6", 6);
          titleButtons.push([xx, y, ww, rh]);
        }
        c.textAlign = "center";
        c.font = "6px monospace";
        c.fillStyle = "#e6e2bb";
        if (!matchMedia("(pointer:coarse)").matches) {
          let px = xx + ww - 17,
            py = wy + titleIndex * rh + 12;
          rect(c, px, py, 6, 1, "#a9ba91");
          rect(c, px + 5, py - 4, 1, 4, "#a9ba91");
          poly(
            c,
            [
              [px - 2, py],
              [px + 1, py - 2],
              [px + 1, py + 3],
            ],
            "#a9ba91",
          );
        }
        c.textAlign = "left";
        c.textBaseline = "alphabetic";
      }
      function showTitle() {
        if (B) return;
        save();
        ui = "";
        $("overlay").hidden = true;
        titleActive = true;
        titleIndex = 0;
        $("stage").classList.add("titleMode");
        $("titleArt").hidden = false;
        titleScene(performance.now());
        $("titleArt").focus({ preventScroll: true });
      }
      function beginGame() {
        titleActive = false;
        $("stage").classList.remove("titleMode");
        $("titleArt").hidden = true;
        closeUI();
        if (!G.party.length) {
          talk(
            "Researcher Oriel",
            "Welcome to Brinewick. The lighthouse is awake, the tide is turning, and three field partners are waiting to meet you.",
            1,
            "starters()",
            "Meet the partners",
          );
        } else
          toast(
            (G.trail ? routeNames[G.trail] : towns[G.z]) +
              " · Expedition resumed",
          );
      }
      function titleSelect(i, approved = false) {
        let opt = titleOptions()[i];
        if (!opt) return;
        if (opt === "Settings") {
          settings();
          return;
        }
        if (opt === "New expedition") {
          if (!approved)
            return confirmation(
              "New expedition?",
              "Starting again replaces the current expedition. Your exported backups remain available.",
              "Start again",
              () => titleSelect(i, true),
              closeUI,
            );
          try {
            localStorage.removeItem(KEY);
          } catch {}
          G = fresh();
        }
        beginGame();
      }
      $("titleArt").onpointermove = (e) => {
        if (!titleActive || ui) return;
        let cv = $("titleArt"),
          r = cv.getBoundingClientRect(),
          x = ((e.clientX - r.left) * cv.width) / r.width,
          y = ((e.clientY - r.top) * cv.height) / r.height;
        let i = titleButtons.findIndex(
          ([l, t, w, h]) => x >= l && x <= l + w && y >= t && y <= t + h,
        );
        if (i >= 0) titleIndex = i;
        cv.style.cursor = i >= 0 ? "pointer" : "default";
      };
      $("titleArt").onpointerdown = (e) => {
        let cv = $("titleArt"),
          r = cv.getBoundingClientRect(),
          x = ((e.clientX - r.left) * cv.width) / r.width,
          y = ((e.clientY - r.top) * cv.height) / r.height;
        let i = titleButtons.findIndex(
          ([l, t, w, h]) => x >= l && x <= l + w && y >= t && y <= t + h,
        );
        if (i >= 0) {
          titleIndex = i;
          enableAudio();
          titleSelect(i);
        }
      };

      function validateCatalogue() {
        let assert = (ok, s) => {
          if (!ok) throw Error("Catalogue: " + s);
        };
        assert(coats.length === 140, "family paint");
        assert(growthByFamily.size === 100, "evolution art catalogue");
        for (const f of families.filter((f) => f.names.length > 1)) {
          const art = growthByFamily.get(f.names[0]);
          assert(
            art &&
              art.notes.length === f.names.length &&
              art.notes.every((note) => note.length > 30) &&
              art.bud.length === 2 &&
              art.matureShape.startsWith("M") &&
              art.veins.startsWith("M") &&
              (f.names.length === 2 || art.developingShape.startsWith("M")),
            f.names[0] + " anatomy",
          );
        }
        assert(
          species.length === 300 &&
            new Set(species.map((d) => d.name)).size === 300,
          "numbering",
        );
        assert(
          families.slice(0, 60).every((f) => f.names.length === 3) &&
            families.slice(60, 100).every((f) => f.names.length === 2) &&
            families.slice(100).length === 40 &&
            families.slice(100).every((f) => f.names.length === 1),
          "families",
        );
        for (let [i, d] of species.entries()) {
          assert(
            d.id === i &&
              zones[d.zone] &&
              d.lore.length > 20 &&
              d.learn.length &&
              d.learn.every(([lv, v]) => lv > 0 && moves[v]) &&
              d.stats.length === 6 &&
              d.stats.every((n) => n > 0) &&
              traitInfo[d.trait] &&
              d.el.every((e) => E[e]),
            d.name,
          );
          if (d.evo)
            assert(
              species[d.evo.to].f === d.f &&
                d.evo.to === i + 1 &&
                ["item", "bond", "place", "level"].includes(d.evo.method),
              "evolution",
            );
          assert(
            d.s
              ? species[i - 1].evo.to === i
              : d.f < 130
                ? pool(d.zone).includes(i)
                : families[d.f].zone === d.zone,
            "acquisition",
          );
        }
        assert(
          new Set(moves.map((m) => m.name)).size === 108 &&
            moves.length === 108 &&
            moves.every(
              (m, i) =>
                m.id === i &&
                m.acc > 0 &&
                m.acc <= 100 &&
                m.cost <= 12 &&
                E[m.e] &&
                m.desc,
            ) &&
            chart.length === 12 &&
            chart.every((row) => row.length === 12 && row.every((n) => n > 0)),
          "battle data",
        );
        assert(
          Object.keys(items).every((k) => Number.isInteger(fresh().bag[k])) &&
            new Set(families.slice(130).map((f) => f.zone)).size === 10,
          "items and shrines",
        );
        return true;
      }
      validateCatalogue();
      document
        .querySelectorAll("[data-art]")
        .forEach((c) => drawIcon(c, c.dataset.art));
      document
        .querySelectorAll("[data-icon]")
        .forEach((b) => b.append(icon(b.dataset.icon)));
      if (G.party.length && !G.party.some((m) => m.hp)) heal();
      refresh();
      drawWorld(0);
      titleScene(0);
      $("titleArt").focus({ preventScroll: true });
      requestAnimationFrame(frame);
      if (saveIssue) toast(saveIssue);
    </script>
  </body>
</html>
